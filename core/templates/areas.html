<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Página de Áreas</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
</head>
<body>
    <h1>ÁREAS</h1>
    <p><a href="{% url 'area_cadastro' %}">Cadastrar</a></p>
    <p>Lista de áreas</p>
    {% for area in lista_areas %}
    <p>{{ area.id }} {{ area.nome }} 
        <a href="{% url 'area_editar' area.id%}">EDITAR</a> | 
        <a href="{% url 'area_remover' area.id%}">REMOVER</a>
    </p>
    {% empty %}
    <p>Nenhuma área cadastrada</p>
    {% endfor %}
    <p><a href="{% url 'inicial' %}">Voltar</a></p>
</body>
</html>
